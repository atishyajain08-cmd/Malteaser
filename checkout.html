<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Malteaser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=orders-1">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="assets/vendor/supabase.min.js"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="catalog.js?v=orders-1"></script>
  <script defer src="checkout.js?v=orders-1"></script>
  <script defer src="script.js?v=orders-1"></script>
</head>
<body class="inner-page">
  <header class="site-header is-scrolled"><a href="index.html" class="brand brand--logo" aria-label="Malteaser home"><img src="assets/malteaser-logo.png" alt=""></a><nav class="main-nav" aria-label="Primary navigation"><a href="shop.html">New Arrivals</a><a href="collections.html">Collections</a><a href="lookbook.html">Lookbook</a><a href="product.html">Product</a></nav><div class="header-actions"><a class="icon-button" href="search.html" aria-label="Search"><i data-lucide="search"></i></a><a class="icon-button" href="wishlist.html" aria-label="Wishlist"><i data-lucide="heart"></i></a><a class="icon-button" href="login.html" aria-label="Customer login"><i data-lucide="user"></i></a><a class="icon-button cart-button" href="cart.html" aria-label="Cart"><i data-lucide="shopping-bag"></i><span>2</span></a></div></header>
  <main class="page-band" style="padding-top: 150px;">
    <div class="split-layout">
      <section class="page-panel" data-reveal>
        <p class="eyebrow">Premium checkout</p>
        <h1>Complete your order</h1>
        <form class="form-grid checkout-form" data-checkout-form>
          <input type="email" name="email" placeholder="Email address" autocomplete="email" required>
          <input type="text" name="full_name" placeholder="Full name" autocomplete="name" minlength="2" required>
          <input type="tel" name="phone" placeholder="Phone number" autocomplete="tel" minlength="8" required>
          <input type="text" name="address_line1" placeholder="Shipping address" autocomplete="address-line1" required>
          <input type="text" name="address_line2" placeholder="Apartment, landmark, or optional detail" autocomplete="address-line2">
          <input type="text" name="city" placeholder="City" autocomplete="address-level2" required>
          <input type="text" name="state" placeholder="State" autocomplete="address-level1" required>
          <input type="text" name="pincode" placeholder="PIN code" autocomplete="postal-code" inputmode="numeric" required>
          <button class="button button--dark magnetic" type="submit">Place Order</button>
          <p class="form-message" data-checkout-message aria-live="polite"></p>
        </form>
      </section>
      <aside class="checkout-summary" data-reveal>
        <p class="eyebrow">Order summary</p>
        <div class="checkout-lines" data-checkout-lines></div>
        <div class="summary-line"><span>Subtotal</span><strong data-checkout-subtotal>Rs. 0</strong></div>
        <div class="summary-line" data-checkout-discount-line hidden><span>Private edit discount</span><strong data-checkout-discount>- Rs. 0</strong></div>
        <h2 data-checkout-total>Rs. 0</h2>
        <p>After placing the order, the Malteaser team will see your shipping details in the backend and prepare dispatch.</p>
        <a href="cart.html" class="text-button" style="color: var(--ivory);">Back to Cart</a>
      </aside>
    </div>
  </main>
</body>
</html>
