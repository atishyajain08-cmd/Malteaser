<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer login for Malteaser premium women's fashion.">
  <title>Customer Login | Malteaser</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=address-2">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="assets/vendor/supabase.min.js"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="auth.js?v=3"></script>
  <script defer src="script.js?v=mobilenav-1"></script>
</head>
<body class="inner-page">
  <header class="site-header is-scrolled">
    <a href="index.html" class="brand brand--logo" aria-label="Malteaser home"><img src="assets/malteaser-logo.png" alt=""></a>
    <nav class="main-nav" aria-label="Primary navigation"><a href="shop.html">New Arrivals</a><a href="collections.html">Collections</a><a href="lookbook.html">Lookbook</a><a href="product.html">Product</a></nav>
    <div class="header-actions"><a class="icon-button" href="search.html" aria-label="Search"><i data-lucide="search"></i></a><a class="icon-button" href="wishlist.html" aria-label="Wishlist"><i data-lucide="heart"></i></a><a class="icon-button" href="login.html" aria-label="Customer login"><i data-lucide="user"></i></a><a class="icon-button cart-button" href="cart.html" aria-label="Cart"><i data-lucide="shopping-bag"></i><span>2</span></a></div>
  </header>

  <main>
    <section class="page-hero login-hero">
      <div class="page-hero__copy" data-reveal>
        <p class="eyebrow">Customer account</p>
        <h1>Welcome back to your private edit.</h1>
        <p>Sign in to view saved outfits, track orders, speed through checkout, and receive early access to new Malteaser drops.</p>
      </div>
      <section class="page-panel login-panel" data-reveal aria-label="Customer login form">
        <p class="eyebrow">Login</p>
        <h2>Customer Login</h2>
        <form class="form-grid" data-customer-login>
          <input type="email" name="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
          <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
          <button type="submit" class="button button--dark magnetic">Sign In</button>
          <p class="form-message" data-auth-message aria-live="polite"></p>
        </form>
        <div class="account-links">
          <a class="text-button" href="signup.html">Create Account</a>
          <a class="text-button" href="forgot-password.html">Forgot Password</a>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
