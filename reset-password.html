<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Choose New Password | Malteaser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=mobilenav-2">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="assets/vendor/supabase.min.js"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="auth.js?v=3"></script>
  <script defer src="script.js?v=mobilenav-1"></script>
</head>
<body class="inner-page">
  <header class="site-header is-scrolled">
    <a href="index.html" class="brand brand--logo" aria-label="Malteaser home"><img src="assets/malteaser-logo.png" alt=""></a>
    <nav class="main-nav" aria-label="Primary navigation"><a href="shop.html">New Arrivals</a><a href="collections.html">Collections</a><a href="lookbook.html">Lookbook</a><a href="product.html">Product</a></nav>
    <div class="header-actions"><a class="icon-button" href="login.html" aria-label="Customer login"><i data-lucide="user"></i></a></div>
  </header>
  <main class="page-band auth-centered">
    <section class="page-panel login-panel" data-reveal>
      <p class="eyebrow">Secure recovery</p>
      <h1>Choose a new password.</h1>
      <p>Use at least 8 characters. Your new password is sent securely to the account service and is never stored in this website's code.</p>
      <form class="form-grid" data-customer-password>
        <input name="password" type="password" placeholder="New password" aria-label="New password" autocomplete="new-password" minlength="8" required>
        <input name="confirm_password" type="password" placeholder="Confirm new password" aria-label="Confirm new password" autocomplete="new-password" minlength="8" required>
        <button class="button button--dark" type="submit">Update Password</button>
        <p class="form-message" data-auth-message aria-live="polite"></p>
      </form>
      <a class="text-button" href="forgot-password.html">Request Another Link</a>
    </section>
  </main>
</body>
</html>
