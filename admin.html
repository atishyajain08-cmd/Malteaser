<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Malteaser Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=arrival-filters-1">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="assets/vendor/supabase.min.js"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="catalog.js?v=arrival-filters-1"></script>
  <script defer src="admin.js?v=arrival-filters-1"></script>
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <a href="index.html" class="brand brand--logo" aria-label="Malteaser home"><img src="assets/malteaser-logo.png" alt=""></a>
      <span>Private administration</span>
    </header>

    <section class="admin-auth" data-admin-auth>
      <div>
        <p class="eyebrow">Secure access</p>
        <h1>Malteaser Admin</h1>
        <p>Sign in with the administrator email created in Supabase.</p>
      </div>
      <form class="admin-form" data-login-form>
        <label>Email<input type="email" name="email" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button button--dark" type="submit">Sign In</button>
        <p class="admin-message" data-login-message aria-live="polite"></p>
      </form>
      <div class="admin-setup" data-admin-setup hidden>
        <strong>Backend connection required</strong>
        <p>Add your Supabase Project URL and public anon key in <code>supabase-config.js</code>. The setup file is included in this repository.</p>
      </div>
    </section>

    <section class="admin-dashboard" data-admin-dashboard hidden>
      <div class="admin-titlebar">
        <div><p class="eyebrow">Catalog manager</p><h1>Collections</h1></div>
        <button class="icon-button" type="button" data-sign-out aria-label="Sign out"><i data-lucide="log-out"></i></button>
      </div>

      <div class="admin-mode" role="tablist" aria-label="Catalog actions">
        <button class="active" type="button" data-admin-mode="add"><i data-lucide="plus"></i> Add collection</button>
        <button type="button" data-admin-mode="remove"><i data-lucide="trash-2"></i> Remove collection</button>
      </div>

      <section class="admin-panel" data-admin-panel="add">
        <form class="admin-form" data-add-form>
          <label>Collection or product name<input type="text" name="title" required></label>
          <label>Description<textarea name="description" rows="4"></textarea></label>
          <label>Price in rupees<input type="number" name="price" min="0" step="1" value="0"></label>
          <label>
            Where should these photos appear?
            <select name="section" required data-section-select>
              <option value="new-arrivals">New Arrivals</option>
              <option value="collections">Collections</option>
              <option value="lookbook">Lookbook</option>
              <option value="product">Product section</option>
            </select>
          </label>
          <label data-arrival-category-field>
            New Arrival category
            <select name="arrival_category" required>
              <option value="">Choose a category</option>
              <option value="Casual">Casual</option>
              <option value="Workwear">Workwear</option>
              <option value="Evening">Evening</option>
            </select>
          </label>
          <label>Photos<input type="file" name="photos" accept="image/png,image/jpeg,image/webp" multiple required></label>
          <button class="button button--dark" type="submit"><i data-lucide="upload"></i> Upload collection</button>
          <p class="admin-message" data-add-message aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-panel" data-admin-panel="remove" hidden>
        <p class="admin-message" data-remove-message aria-live="polite"></p>
        <div class="admin-items" data-admin-items></div>
      </section>
    </section>
  </main>
</body>
</html>
