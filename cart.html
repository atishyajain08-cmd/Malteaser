<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Malteaser</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=address-1">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="assets/vendor/supabase.min.js"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="catalog.js?v=address-1"></script>
  <script defer src="script.js?v=mobilenav-1"></script>
</head>
<body class="inner-page">
  <header class="site-header is-scrolled"><a href="index.html" class="brand brand--logo" aria-label="Malteaser home"><img src="assets/malteaser-logo.png" alt=""></a><nav class="main-nav" aria-label="Primary navigation"><a href="shop.html">New Arrivals</a><a href="collections.html">Collections</a><a href="lookbook.html">Lookbook</a><a href="product.html">Product</a></nav><div class="header-actions"><a class="icon-button" href="search.html" aria-label="Search"><i data-lucide="search"></i></a><a class="icon-button" href="wishlist.html" aria-label="Wishlist"><i data-lucide="heart"></i></a><a class="icon-button" href="login.html" aria-label="Customer login"><i data-lucide="user"></i></a><a class="icon-button cart-button" href="cart.html" aria-label="Cart"><i data-lucide="shopping-bag"></i><span>2</span></a></div></header>
  <main class="page-band" style="padding-top: 150px;">
    <div class="split-layout">
      <section><p class="eyebrow">Shopping bag</p><h1>Your cart</h1><div data-cart-items></div></section>
      <aside class="checkout-summary">
        <p class="eyebrow">Order summary</p>
        <div class="summary-line"><span>Subtotal</span><strong data-cart-subtotal>Rs. 0</strong></div>
        <div class="summary-line" data-discount-line hidden><span>Private edit discount</span><strong data-cart-discount>- Rs. 0</strong></div>
        <h2 data-cart-total>Rs. 0</h2>
        <form class="coupon-form" data-coupon-form>
          <label for="coupon">Coupon code</label>
          <div><input id="coupon" name="coupon" type="text" placeholder="Try MALTEASER10"><button type="submit">Apply</button></div>
          <p data-coupon-message aria-live="polite"></p>
        </form>
        <p>Includes premium packaging. Shipping and taxes calculated at checkout.</p>
        <a href="checkout.html" class="button button--gold magnetic">Checkout</a>
      </aside>
    </div>
  </main>
</body>
</html>
