  <header class="site-header is-scrolled"><a href="index.html" class="brand brand--logo" aria-label="Malteaser home"><img src="assets/malteaser-logo.png" alt=""></a><nav class="main-nav" aria-label="Primary navigation"><a href="shop.html">New Arrivals</a><a href="collections.html">Collections</a><a href="lookbook.html">Lookbook</a><a href="product.html">Product</a></nav><div class="header-actions"><a class="icon-button" href="search.html" aria-label="Search"><i data-lucide="search"></i></a><a class="icon-button" href="login.html" aria-label="Customer login"><i data-lucide="user"></i></a><a class="icon-button cart-button" href="cart.html" aria-label="Cart"><i data-lucide="shopping-bag"></i><span></span></a></div></header>
  <main><section class="page-hero account-hero"><div class="page-hero__copy" data-reveal><p class="eyebrow">Private membership</p><h1>Create your Malteaser account.</h1><p>Save pieces, build your wardrobe edit, and receive early access to new collections.</p></div><section class="page-panel login-panel" data-reveal><p class="eyebrow">Sign up</p><h2>Join the circle</h2><form class="form-grid" data-customer-signup><input name="full_name" type="text" placeholder="Full name" aria-label="Full name" autocomplete="name" minlength="2" required><input name="email" type="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required><input name="password" type="password" placeholder="Password (8+ characters)" aria-label="Password" autocomplete="new-password" minlength="8" required><input name="confirm_password" type="password" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password" minlength="8" required><button class="button button--dark" type="submit">Create Account</button><p class="form-message" data-auth-message aria-live="polite"></p></form><div class="account-links"><a class="text-button" href="login.html">Already have an account?</a></div></section></section></main>
